<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plotnikov Peppers - Кейсы</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            background: linear-gradient(45deg, #ff9a00, #ff6a00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .balance-container {
            background: rgba(0, 0, 0, 0.5);
            padding: 12px 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            font-size: 1.3rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        /* Кейсы в ряд */
        .cases-row {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            width: 100%;
            margin-bottom: 40px;
        }
        
        .case-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 320px;
            position: relative;
        }
        
        .case-image {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: all 0.3s;
            filter: brightness(0.7);
            border: 4px solid transparent;
        }
        
        .case-image.unlocked {
            filter: brightness(1);
            border: 4px solid #ff9a00;
        }
        
        .case-image:hover.unlocked {
            transform: scale(1.07);
            box-shadow: 0 20px 40px rgba(255, 154, 0, 0.4);
        }
        
        .case-info {
            margin-top: 18px;
            font-size: 1.6rem;
            text-align: center;
            font-weight: bold;
        }
        
        .case-info small {
            font-size: 1rem;
            color: #ccc;
            display: block;
            margin-top: 5px;
        }
        
        .spin-button {
            background: linear-gradient(45deg, #ff9a00, #ff6a00);
            border: none;
            color: white;
            padding: 15px 45px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            box-shadow: 0 6px 18px rgba(255, 106, 0, 0.4);
            opacity: 0;
            pointer-events: none;
        }
        
        .spin-button.visible {
            opacity: 1;
            pointer-events: auto;
        }
        
        .spin-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(255, 106, 0, 0.6);
        }
        
        .spin-button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .lock-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            font-size: 1.3rem;
            color: #ff9a00;
            text-shadow: 0 0 12px #ff9a00;
            cursor: pointer;
            border: 4px dashed #ff9a00;
        }
        
        .lock-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        /* Модальное окно */
        .promo-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .promo-modal.show {
            opacity: 1;
            visibility: visible;
        }
        
        .promo-modal-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 45px;
            border-radius: 25px;
            border: 3px solid #ff9a00;
            width: 90%;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(255, 106, 0, 0.4);
            transform: scale(0.85);
            transition: transform 0.3s ease;
        }
        
        .promo-modal.show .promo-modal-content {
            transform: scale(1);
        }
        
        .promo-modal h2 {
            font-size: 2.4rem;
            margin-bottom: 25px;
            color: #ff9a00;
            text-shadow: 0 0 10px #ff9a00;
        }
        
        .promo-modal input {
            width: 100%;
            padding: 18px;
            font-size: 1.4rem;
            border: 3px solid #ff9a00;
            border-radius: 18px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 3px;
            font-weight: bold;
        }
        
        .promo-modal input::placeholder {
            color: #999;
            letter-spacing: normal;
            font-weight: normal;
        }
        
        .promo-modal-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        
        .promo-modal .btn {
            padding: 15px 45px;
            border: none;
            border-radius: 30px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .promo-modal .btn-primary {
            background: linear-gradient(45deg, #9c27b0, #e91e63);
            color: white;
            box-shadow: 0 6px 18px rgba(156, 39, 176, 0.4);
        }
        
        .promo-modal .btn-secondary {
            background: #555;
            color: white;
        }
        
        .promo-modal .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        
        .promo-modal .close-btn {
            position: absolute;
            top: 18px;
            right: 22px;
            font-size: 2.2rem;
            color: #ff9a00;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .promo-modal .close-btn:hover {
            transform: rotate(90deg) scale(1.3);
        }

        /* Спин */
        .spin-area {
            width: 100%;
            max-width: 900px;
            height: 200px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            border: 4px solid #ff9a00;
            margin: 40px 0;
            display: none;
        }

        .spin-items {
            display: flex;
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            transition: transform 0.1s linear;
        }

        .spin-item {
            width: 200px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .spin-item-image {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .spin-item-name {
            margin-top: 10px;
            font-size: 0.9rem;
            text-align: center;
        }

        .center-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 5px;
            background: #ff9a00;
            transform: translateX(-50%);
            box-shadow: 0 0 20px #ff9a00;
            z-index: 10;
        }

        /* Результат */
        .result-container {
            display: none;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 25px;
            border: 4px solid #ff9a00;
            max-width: 500px;
            width: 100%;
            margin: 40px 0;
        }

        .result-image {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 20px;
            margin: 20px 0;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        .result-buttons {
            display: flex;
            gap: 25px;
            margin-top: 25px;
        }

        .sell-button, .keep-button {
            padding: 16px 50px;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .sell-button {
            background: linear-gradient(45deg, #00c853, #00e676);
            box-shadow: 0 6px 18px rgba(0, 200, 83, 0.4);
        }

        .keep-button {
            background: linear-gradient(45deg, #2196F3, #21CBF3);
            box-shadow: 0 6px 18px rgba(33, 150, 243, 0.4);
        }

        /* Возможные выигрыши */
        .possible-items {
            width: 100%;
            max-width: 1200px;
            margin: 50px 0;
        }

        .possible-items h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #ff9a00;
            font-size: 2.2rem;
        }

        .items-row {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 18px;
        }

        .item-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 15px;
            text-align: center;
            transition: transform 0.3s;
        }

        .item-card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.15);
        }

        .item-card img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 12px;
        }

        .section-divider {
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ff9a00, transparent);
            margin: 60px 0;
        }

        @keyframes notifIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes notifOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Plotnikov Peppers</h1>
        
        <div class="balance-container">
            Баланс: <span id="balance">10</span> зв
        </div>
        
        <!-- Кейсы в ряд -->
        <div class="cases-row">
            <!-- TON -->
            <div class="case-block">
                <img src="https://static43.tgcnt.ru/posts/_0/80/80772e1305ea14d1dc091f6010590764.jpg" alt="TON" class="case-image unlocked" id="tonCaseImage">
                <div class="case-info">Кейс TON<small>5 зв</small></div>
                <button class="spin-button" id="tonSpinButton" disabled>Крутить</button>
            </div>

            <!-- Peppers -->
            <div class="case-block">
                <img src="https://cdn1.cdn-telegram.org/file/eBvI08_1VZA98t4JG3LV993s9IEdV5OTU6F5lAFsnDii8IebpMVDs8S799luguavxkvteghEiABpQxK15KUcM1YW7S3roIZrBH3ERwRxdH8kNkwyGYoB16fXwS1RdkoM9Zx1yepmqeYUHSNDemzxhbyiDx6PH1166RvQHyTtX4iPnH7denevoBLHjBZMoPbzgi8YtBdd6vIYalbF74RvV7s_7oN-W28_pWpr9rqiNFBS80rZYVkuq-YJzvqVsVXcWmx_EArr5qmm2lFqDjBxhwlMoLR-tPP4NSX6h3UqM8KOHkiMMVlxgxUX2dbkEdInMKIGBuyVlJGpplJD-I3_Zw.jpg" alt="Peppers" class="case-image unlocked" id="peppersCaseImage">
                <div class="case-info">Кейс Peppers<small>1 зв</small></div>
                <button class="spin-button" id="peppersSpinButton" disabled>Крутить</button>
            </div>

            <!-- Промо -->
            <div class="case-block" id="promoCaseBlock">
                <div class="lock-overlay" id="promoLock">
                    <div class="lock-icon">Lock</div>
                    <div>Введи промокод</div>
                </div>
                <img src="https://avatars.dzeninfra.ru/get-zen_doc/271828/pub_67e6688fe0b83841b3615a49_67e668b4e5a82b6118c3efd6/scale_1200" alt="Promo" class="case-image" id="promoCaseImage">
                <div class="case-info">Кейс Промо<small style="color:#00e676;">Бесплатно</small></div>
                <button class="spin-button" id="promoSpinButton" disabled style="display:none;">Крутить бесплатно</button>
            </div>
        </div>

        <!-- Спин -->
        <div class="spin-area" id="spinArea">
            <div class="spin-items" id="spinItems"></div>
            <div class="center-line"></div>
        </div>

        <!-- Результат -->
        <div class="result-container" id="resultContainer">
            <div class="result-title">Поздравляем!</div>
            <div class="result-info">Вам выпал:</div>
            <img src="" alt="" class="result-image" id="resultImage">
            <div class="result-info" id="resultItemName"></div>
            <div class="result-info">Цена: <span id="prizeValue">0</span> зв</div>
            <div class="result-buttons">
                <button class="sell-button" id="sellButton">Продать</button>
                <button class="keep-button" id="keepButton">Оставить</button>
            </div>
        </div>

        <div class="section-divider"></div>

        <!-- Выигрыши -->
        <div class="possible-items">
            <h2>Возможные выигрыши</h2>
            <div class="items-row">
                <div><h3 style="color:#00c853;text-align:center;">TON</h3><div class="items-grid" id="tonItemsGrid"></div></div>
                <div><h3 style="color:#ff9a00;text-align:center;">Peppers</h3><div class="items-grid" id="peppersItemsGrid"></div></div>
                <div><h3 style="color:#e91e63;text-align:center;">Промо</h3><div class="items-grid" id="promoItemsGrid"></div></div>
            </div>
        </div>

        <!-- Модальное окно -->
        <div class="promo-modal" id="promoModal">
            <div class="promo-modal-content">
                <div class="close-btn" id="closeModal">X</div>
                <h2>Введи промокод</h2>
                <input type="text" id="promoInputModal" placeholder="PLOTNIKOV" autocomplete="off">
                <div class="promo-modal-buttons">
                    <button class="btn btn-primary" id="activatePromo">Активировать</button>
                    <button class="btn btn-secondary" id="cancelPromo">Отмена</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const balanceEl = document.getElementById('balance');
            const tonImg = document.getElementById('tonCaseImage');
            const peppersImg = document.getElementById('peppersCaseImage');
            const promoImg = document.getElementById('promoCaseImage');
            const promoLock = document.getElementById('promoLock');
            const promoModal = document.getElementById('promoModal');
            const promoInput = document.getElementById('promoInputModal');
            const activateBtn = document.getElementById('activatePromo');
            const cancelBtn = document.getElementById('cancelPromo');
            const closeBtn = document.getElementById('closeModal');
            const spinArea = document.getElementById('spinArea');
            const spinItems = document.getElementById('spinItems');
            const resultCont = document.getElementById('resultContainer');
            const resultImg = document.getElementById('resultImage');
            const resultName = document.getElementById('resultItemName');
            const prizeVal = document.getElementById('prizeValue');
            const sellBtn = document.getElementById('sellButton');
            const keepBtn = document.getElementById('keepButton');
            const tonGrid = document.getElementById('tonItemsGrid');
            const peppersGrid = document.getElementById('peppersItemsGrid');
            const promoGrid = document.getElementById('promoItemsGrid');

            const tonSpin = document.getElementById('tonSpinButton');
            const peppersSpin = document.getElementById('peppersSpinButton');
            const promoSpin = document.getElementById('promoSpinButton');

            let balance = 10;
            let isSpinning = false;
            let winItem = null;
            let currentCase = null;
            let promoUnlocked = false;
            const PROMO_CODE = "PLOTNIKOV";

            const tonItems = [
                { id: 1, name: "NFT Дуров", image: "https://static43.tgcnt.ru/posts/_0/80/80772e1305ea14d1dc091f6010590764.jpg", price: 2500000 },
                { id: 2, name: "TON Кристалл", image: "https://cache.tonapi.io/imgproxy/70VIqyeGnFGEcy0LdcARzMf_4i6KXNP1VR-kY0ft4R4/rs:fill:1500:1500:1/g:no/aHR0cHM6Ly9uZnQuZnJhZ21lbnQuY29tL2dpZnQvdG9uLWNyeXN0YWwtMTAxLndlYnA.webp", price: 1800000 }
            ];

            const peppersItems = [
                { id: 3, name: "Редкий Пепе", image: "https://cache.tonapi.io/imgproxy/70VIqyeGnFGEcy0LdcARzMf_4i6KXNP1VR-kY0ft4R4/rs:fill:1500:1500:1/g:no/aHR0cHM6Ly9uZnQuZnJhZ21lbnQuY29tL2dpZnQvcGx1c2hwZXBlLTEyNDkud2VicA.webp", price: 1000000 },
                { id: 4, name: "Эпик Пепе", image: "https://cache.tonapi.io/imgproxy/HmV4XnZ4mSWc1Vss6Be_PIoEjcvaKhsuBw1gEUcdHkw/rs:fill:1500:1500:1/g:no/aHR0cHM6Ly9uZnQuZnJhZ21lbnQuY29tL2dpZnQvcGx1c2hwZXBlLTExODQud2VicA.webp", price: 500000 }
            ];

            const promoItems = [
                { id: 5, name: "Подарок: Сердце", image: "https://avatars.dzeninfra.ru/get-zen_doc/271828/pub_67e6688fe0b83841b3615a49_67e668b4e5a82b6118c3efd6/scale_1200", price: 500000 },
                { id: 6, name: "Подарок: Цветы", image: "https://i.pinimg.com/736x/8a/9e/8b/8a9e8b9f8e9d8a7b6c5d4e3f2g1h0i9j.jpg", price: 300000 }
            ];

            balanceEl.textContent = balance;
            renderGrid(tonItems, tonGrid);
            renderGrid(peppersItems, peppersGrid);
            renderGrid(promoItems, promoGrid);

            // Модальное окно
            promoLock.onclick = () => {
                if (!promoUnlocked) {
                    promoModal.classList.add('show');
                    setTimeout(() => promoInput.focus(), 300);
                }
            };

            closeBtn.onclick = cancelBtn.onclick = () => {
                promoModal.classList.remove('show');
                promoInput.value = '';
            };

            promoModal.onclick = (e) => { if (e.target === promoModal) cancelBtn.click(); };

            activateBtn.onclick = () => {
                if (promoInput.value.trim().toUpperCase() === PROMO_CODE) {
                    promoUnlocked = true;
                    promoLock.style.display = 'none';
                    promoImg.classList.add('unlocked');
                    promoSpin.style.display = 'block';
                    promoModal.classList.remove('show');
                    showNotif("Кейс разблокирован!");
                } else {
                    showNotif("Неверный промокод!");
                }
            };

            promoInput.onkeypress = (e) => { if (e.key === 'Enter') activateBtn.click(); };

            // Клик по кейсам
            tonImg.onclick = () => selectCase('ton', 5, tonSpin);
            peppersImg.onclick = () => selectCase('peppers', 1, peppersSpin);
            promoImg.onclick = () => promoUnlocked && selectCase('promo', 0, promoSpin);

            function selectCase(type, cost, btn) {
                if (isSpinning || (cost > 0 && balance < cost)) return;
                disableAll();
                btn.classList.add('visible');
                btn.disabled = false;
                currentCase = type;
            }

            // Спин
            tonSpin.onclick = () => spin(5, tonItems);
            peppersSpin.onclick = () => spin(1, peppersItems);
            promoSpin.onclick = () => spin(0, promoItems);

            function spin(cost, items) {
                if (isSpinning || (cost > 0 && balance < cost)) return;
                isSpinning = true;
                disableAll();
                if (cost > 0) { balance -= cost; balanceEl.textContent = balance; }

                spinArea.style.display = 'block';
                resultCont.style.display = 'none';
                spinItems.innerHTML = '';

                const total = 40;
                const width = 200;
                const center = Math.floor(total / 2);
                const winIdx = Math.floor(Math.random() * items.length);
                winItem = { ...items[winIdx] };

                for (let i = 0; i < total; i++) {
                    const item = items[Math.floor(Math.random() * items.length)];
                    const div = document.createElement('div');
                    div.className = 'spin-item';
                    div.innerHTML = `<img src="${item.image}" class="spin-item-image"><div class="spin-item-name">${item.name}</div>`;
                    spinItems.appendChild(div);
                }

                const target = -(center * width) + (spinArea.offsetWidth / 2 - width / 2);
                let pos = 0;
                const duration = 3000;
                const start = Date.now();

                function animate() {
                    const elapsed = Date.now() - start;
                    const progress = Math.min(elapsed / duration, 1);
                    const ease = 1 - Math.pow(1 - progress, 3);
                    pos = ease * (target + total * width * 2);
                    spinItems.style.transform = `translateX(${-pos}px)`;
                    if (progress < 1) requestAnimationFrame(animate);
                    else {
                        spinItems.style.transform = `translateX(${target}px)`;
                        setTimeout(showResult, 600);
                    }
                }
                requestAnimationFrame(animate);
            }

            function showResult() {
                resultImg.src = winItem.image;
                resultName.textContent = winItem.name;
                prizeVal.textContent = winItem.price.toLocaleString();
                resultCont.style.display = 'flex';
                isSpinning = false;
                updateButtons();
            }

            function updateButtons() {
                tonSpin.disabled = balance < 5;
                peppersSpin.disabled = balance < 1;
                promoSpin.disabled = !promoUnlocked;
            }

            function disableAll() {
                [tonSpin, peppersSpin, promoSpin].forEach(b => {
                    b.classList.remove('visible');
                    b.disabled = true;
                });
            }

            sellBtn.onclick = () => {
                balance += winItem.price;
                balanceEl.textContent = balance;
                reset();
                showNotif(`+${winItem.price.toLocaleString()} зв`);
            };

            keepBtn.onclick = () => {
                reset();
                showNotif(`${winItem.name} в инвентаре`);
            };

            function reset() {
                resultCont.style.display = 'none';
                spinArea.style.display = 'none';
                updateButtons();
                winItem = null;
            }

            function showNotif(msg) {
                const n = document.createElement('div');
                n.textContent = msg;
                n.style.cssText = `position:fixed;top:20px;right:20px;background:rgba(0,0,0,0.9);color:white;padding:16px 28px;border-radius:14px;font-size:1.1rem;z-index:10000;border-left:6px solid #ff9a00;animation:notifIn .4s ease-out;box-shadow:0 6px 20px rgba(0,0,0,0.5);`;
                document.body.appendChild(n);
                setTimeout(() => {
                    n.style.animation = 'notifOut .4s ease-in';
                    setTimeout(() => n.remove(), 400);
                }, 3000);
            }

            function renderGrid(items, grid) {
                items.forEach(i => {
                    const c = document.createElement('div');
                    c.className = 'item-card';
                    c.innerHTML = `<img src="${i.image}"><div class="item-name">${i.name}</div><div class="item-price">${i.price.toLocaleString()} зв</div>`;
                    grid.appendChild(c);
                });
            }
        });
    </script>
</body>
</html>
