<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plotnikov Peppers - Кейсы</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            background: linear-gradient(45deg, #ff9a00, #ff6a00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .balance-container {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }
        
        .case-container {
            margin: 20px 0;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .case-image {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .case-image:hover {
            transform: scale(1.05);
        }
        
        .case-info {
            margin-top: 15px;
            font-size: 1.5rem;
            text-align: center;
        }
        
        .spin-button {
            background: linear-gradient(45deg, #ff9a00, #ff6a00);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(255, 106, 0, 0.4);
        }
        
        .spin-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 106, 0, 0.6);
        }
        
        .spin-button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .spin-area {
            width: 100%;
            max-width: 800px;
            height: 200px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin: 30px 0;
            overflow: hidden;
            position: relative;
            border: 2px solid #ff9a00;
            display: none;
        }
        
        .spin-items {
            display: flex;
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            transition: transform 0.1s linear;
        }
        
        .spin-item {
            width: 200px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        
        .spin-item-image {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
        }
        
        .spin-item-name {
            margin-top: 10px;
            font-size: 0.9rem;
            text-align: center;
        }
        
        .result-container {
            margin-top: 30px;
            display: none;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #ff9a00;
            width: 100%;
            max-width: 500px;
        }
        
        .result-title {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #ff9a00;
            text-align: center;
        }
        
        .result-image {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }
        
        .result-info {
            margin-top: 15px;
            font-size: 1.5rem;
            text-align: center;
        }
        
        .result-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .sell-button, .keep-button {
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .sell-button {
            background: linear-gradient(45deg, #00c853, #00e676);
            box-shadow: 0 5px 15px rgba(0, 200, 83, 0.4);
        }
        
        .sell-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 200, 83, 0.6);
        }
        
        .keep-button {
            background: linear-gradient(45deg, #2196F3, #21CBF3);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
        }
        
        .keep-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(33, 150, 243, 0.6);
        }
        
        .possible-items {
            width: 100%;
            margin-top: 40px;
        }
        
        .possible-items h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ff9a00;
        }
        
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .item-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s;
        }
        
        .item-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
        }
        
        .item-card img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .item-card .item-name {
            margin-top: 8px;
            font-size: 0.9rem;
            text-align: center;
        }
        
        .item-card .item-price {
            margin-top: 5px;
            font-size: 0.8rem;
            color: #ff9a00;
        }
        
        .center-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #ff9a00;
            transform: translateX(-50%);
            box-shadow: 0 0 10px #ff9a00;
            z-index: 10;
        }
        
        .win-animation {
            animation: winPulse 1s infinite;
        }
        
        @keyframes winPulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 154, 0, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 154, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 154, 0, 0); }
        }
        
        /* Стили для апгрейда */
        .upgrade-section {
            width: 100%;
            margin-top: 40px;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #ff9a00;
        }
        
        .upgrade-section h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ff9a00;
        }
        
        .upgrade-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .upgrade-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 30%;
        }
        
        .upgrade-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        
        .upgrade-arrow {
            font-size: 2rem;
            color: #ff9a00;
        }
        
        .upgrade-wheel {
            width: 300px;
            height: 300px;
            position: relative;
            margin: 0 auto 20px;
        }
        
        .wheel-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #00c853 0% 30%,
                transparent 30% 100%
            );
            position: relative;
            transition: transform 3s cubic-bezier(0.2, 0.8, 0.3, 1);
        }
        
        .wheel-pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 40px;
            background: #ff9a00;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            z-index: 10;
        }
        
        .wheel-spin-button {
            background: linear-gradient(45deg, #ff9a00, #ff6a00);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(255, 106, 0, 0.4);
            display: block;
            margin: 20px auto;
        }
        
        .wheel-spin-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 106, 0, 0.6);
        }
        
        .wheel-spin-button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .upgrade-result {
            text-align: center;
            margin-top: 20px;
            font-size: 1.2rem;
            display: none;
        }
        
        /* Стили для инвентаря */
        .inventory-section {
            width: 100%;
            margin-top: 40px;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #ff9a00;
        }
        
        .inventory-section h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ff9a00;
        }
        
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .inventory-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: transform 0.3s;
        }
        
        .inventory-item:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
        }
        
        .inventory-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .inventory-item .item-name {
            margin-top: 8px;
            font-size: 0.8rem;
            text-align: center;
        }
        
        .inventory-item .item-price {
            margin-top: 5px;
            font-size: 0.7rem;
            color: #ff9a00;
        }
        
        .inventory-item-actions {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }
        
        .inventory-sell-button {
            background: linear-gradient(45deg, #00c853, #00e676);
            border: none;
            color: white;
            padding: 5px 10px;
            font-size: 0.7rem;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .inventory-sell-button:hover {
            transform: scale(1.05);
        }
        
        .select-checkbox {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .empty-inventory {
            text-align: center;
            padding: 20px;
            color: #999;
            grid-column: 1 / -1;
        }
        
        .upgrade-success {
            color: #00c853;
            font-weight: bold;
        }
        
        .upgrade-fail {
            color: #ff3d00;
            font-weight: bold;
        }
        
        .section-divider {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff9a00, transparent);
            margin: 30px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Приветствуем Вас в Plotnikov Peppers</h1>
        
        <div class="balance-container">
            Баланс: <span id="balance">1</span> зв
        </div>
        
        <div class="case-container">
            <img src="https://cdn1.cdn-telegram.org/file/eBvI08_1VZA98t4JG3LV993s9IEdV5OTU6F5lAFsnDii8IebpMVDs8S799luguavxkvteghEiABpQxK15KUcM1YW7S3roIZrBH3ERwRxdH8kNkwyGYoB16fXwS1RdkoM9Zx1yepmqeYUHSNDemzxhbyiDx6PH1166RvQHyTtX4iPnH7denevoBLHjBZMoPbzgi8YtBdd6vIYalbF74RvV7s_7oN-W28_pWpr9rqiNFBS80rZYVkuq-YJzvqVsVXcWmx_EArr5qmm2lFqDjBxhwlMoLR-tPP4NSX6h3UqM8KOHkiMMVlxgxUX2dbkEdInMKIGBuyVlJGpplJD-I3_Zw.jpg" alt="Кейс" class="case-image" id="caseImage">
            <div class="case-info">
                Кейс Plotnikov Peppers<br>
                Цена: 1 зв
            </div>
        </div>
        
        <button class="spin-button" id="spinButton" disabled>Крутить за 1 зв</button>
        
        <div class="spin-area" id="spinArea">
            <div class="spin-items" id="spinItems"></div>
            <div class="center-line"></div>
        </div>
        
        <div class="result-container" id="resultContainer">
            <div class="result-title">Поздравляем!</div>
            <div class="result-info">Вам выпал:</div>
            <img src="" alt="Результат" class="result-image" id="resultImage">
            <div class="result-info" id="resultItemName"></div>
            <div class="result-info">
                Цена: <span id="prizeValue">1000000</span> зв
            </div>
            <div class="result-buttons">
                <button class="sell-button" id="sellButton">Продать</button>
                <button class="keep-button" id="keepButton">Оставить в инвентаре</button>
            </div>
        </div>
        
        <div class="section-divider"></div>
        
        <div class="possible-items">
            <h2>Возможные выигрыши</h2>
            <div class="items-grid" id="itemsGrid"></div>
        </div>
        
        <div class="section-divider"></div>
        
        <div class="upgrade-section">
            <h2>Апгрейд скинов</h2>
            <div class="upgrade-container">
                <div class="upgrade-item" id="upgradeItem1">
                    <img src="" alt="Предмет 1">
                    <div class="item-name">Выберите предмет</div>
                </div>
                <div class="upgrade-arrow">→</div>
                <div class="upgrade-item" id="upgradeItem2">
                    <img src="" alt="Предмет 2">
                    <div class="item-name">Выберите предмет</div>
                </div>
            </div>
            <div class="upgrade-wheel">
                <div class="wheel-circle" id="wheelCircle">
                    <div class="wheel-pointer" id="wheelPointer"></div>
                </div>
            </div>
            <button class="wheel-spin-button" id="upgradeButton" disabled>Апгрейд</button>
            <div class="upgrade-result" id="upgradeResult"></div>
        </div>
        
        <div class="section-divider"></div>
        
        <div class="inventory-section">
            <h2>Инвентарь</h2>
            <div class="inventory-grid" id="inventoryGrid">
                <div class="empty-inventory">Инвентарь пуст</div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const caseImage = document.getElementById('caseImage');
            const spinButton = document.getElementById('spinButton');
            const spinArea = document.getElementById('spinArea');
            const spinItems = document.getElementById('spinItems');
            const resultContainer = document.getElementById('resultContainer');
            const resultImage = document.getElementById('resultImage');
            const resultItemName = document.getElementById('resultItemName');
            const prizeValue = document.getElementById('prizeValue');
            const sellButton = document.getElementById('sellButton');
            const keepButton = document.getElementById('keepButton');
            const balanceElement = document.getElementById('balance');
            const itemsGrid = document.getElementById('itemsGrid');
            const inventoryGrid = document.getElementById('inventoryGrid');
            const upgradeItem1 = document.getElementById('upgradeItem1');
            const upgradeItem2 = document.getElementById('upgradeItem2');
            const upgradeButton = document.getElementById('upgradeButton');
            const wheelCircle = document.getElementById('wheelCircle');
            const upgradeResult = document.getElementById('upgradeResult');
            
            let balance = 1;
            let isSpinning = false;
            let currentWinItem = null;
            let inventory = [];
            let selectedItems = [];
            
            // Возможные предметы для выпадения
            const items = [
                {
                    id: 1,
                    name: "Редкий Плюш Пепе",
                    image: "https://cache.tonapi.io/imgproxy/70VIqyeGnFGEcy0LdcARzMf_4i6KXNP1VR-kY0ft4R4/rs:fill:1500:1500:1/g:no/aHR0cHM6Ly9uZnQuZnJhZ21lbnQuY29tL2dpZnQvcGx1c2hwZXBlLTEyNDkud2VicA.webp",
                    price: 1000000
                },
                {
                    id: 2,
                    name: "Эпический Плюш Пепе",
                    image: "https://cache.tonapi.io/imgproxy/HmV4XnZ4mSWc1Vss6Be_PIoEjcvaKhsuBw1gEUcdHkw/rs:fill:1500:1500:1/g:no/aHR0cHM6Ly9uZnQuZnJhZ21lbnQuY29tL2dpZnQvcGx1c2hwZXBlLTExODQud2VicA.webp",
                    price: 500000
                }
            ];
            
            // Заполняем галерею возможных выигрышей
            items.forEach(item => {
                const itemCard = document.createElement('div');
                itemCard.className = 'item-card';
                
                itemCard.innerHTML = `
                    <img src="${item.image}" alt="${item.name}">
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">${item.price.toLocaleString()} зв</div>
                `;
                
                itemsGrid.appendChild(itemCard);
            });
            
            // При клике на кейс активируем кнопку "Крутить"
            caseImage.addEventListener('click', function() {
                if (balance >= 1 && !isSpinning) {
                    spinButton.disabled = false;
                }
            });
            
            // Функция прокрутки
            spinButton.addEventListener('click', function() {
                if (balance < 1 || isSpinning) return;
                
                isSpinning = true;
                spinButton.disabled = true;
                balance -= 1;
                balanceElement.textContent = balance;
                
                // Показываем область прокрутки
                spinArea.style.display = 'block';
                
                // Заполняем область прокрутки предметами
                spinItems.innerHTML = '';
                const itemCount = 50; // Количество элементов для прокрутки
                
                for (let i = 0; i < itemCount; i++) {
                    const randomItem = items[Math.floor(Math.random() * items.length)];
                    const spinItem = document.createElement('div');
                    spinItem.className = 'spin-item';
                    
                    spinItem.innerHTML = `
                        <img src="${randomItem.image}" alt="${randomItem.name}" class="spin-item-image">
                        <div class="spin-item-name">${randomItem.name}</div>
                    `;
                    
                    spinItems.appendChild(spinItem);
                }
                
                // Определяем выигрышный предмет
                const winIndex = Math.floor(Math.random() * items.length);
                currentWinItem = {...items[winIndex]};
                
                // Анимация прокрутки
                let position = 0;
                let speed = 50;
                let targetPosition = 0;
                
                // Вычисляем позицию, на которой должен остановиться выигрышный предмет
                const itemWidth = 200;
                const centerOffset = 2; // Смещение для центрирования
                targetPosition = -(itemCount - centerOffset - winIndex) * itemWidth;
                
                const spinAnimation = setInterval(() => {
                    position -= speed;
                    
                    // Замедление при приближении к цели
                    if (position <= targetPosition + 1000) {
                        speed *= 0.95;
                    }
                    
                    // Остановка анимации
                    if (position <= targetPosition) {
                        clearInterval(spinAnimation);
                        position = targetPosition;
                        
                        // Показываем результат
                        setTimeout(() => {
                            resultImage.src = currentWinItem.image;
                            resultItemName.textContent = currentWinItem.name;
                            prizeValue.textContent = currentWinItem.price.toLocaleString();
                            resultContainer.style.display = "flex";
                            resultImage.classList.add("win-animation");
                            isSpinning = false;
                        }, 500);
                    }
                    
                    spinItems.style.transform = `translateX(${position}px)`;
                }, 20);
            });
            
            // Продажа выигрыша
            sellButton.addEventListener('click', function() {
                if (currentWinItem) {
                    balance += currentWinItem.price;
                    balanceElement.textContent = balance;
                    resultContainer.style.display = "none";
                    spinArea.style.display = "none";
                    spinButton.disabled = balance < 1;
                    resultImage.classList.remove("win-animation");
                    
                    // Показываем уведомление о продаже
                    showNotification(`Предмет "${currentWinItem.name}" продан за ${currentWinItem.price.toLocaleString()} зв`);
                    
                    currentWinItem = null;
                }
            });
            
            // Оставить в инвентаре
            keepButton.addEventListener('click', function() {
                if (currentWinItem) {
                    addToInventory(currentWinItem);
                    resultContainer.style.display = "none";
                    spinArea.style.display = "none";
                    spinButton.disabled = balance < 1;
                    resultImage.classList.remove("win-animation");
                    
                    // Показываем уведомление о добавлении в инвентарь
                    showNotification(`Предмет "${currentWinItem.name}" добавлен в инвентарь`);
                    
                    currentWinItem = null;
                }
            });
            
            // Функция добавления предмета в инвентарь
            function addToInventory(item) {
                const inventoryItem = {
                    ...item,
                    inventoryId: Date.now() + Math.random()
                };
                inventory.push(inventoryItem);
                updateInventoryDisplay();
            }
            
            // Обновление отображения инвентаря
            function updateInventoryDisplay() {
                inventoryGrid.innerHTML = '';
                
                if (inventory.length === 0) {
                    inventoryGrid.innerHTML = '<div class="empty-inventory">Инвентарь пуст</div>';
                    return;
                }
                
                inventory.forEach(item => {
                    const inventoryItem = document.createElement('div');
                    inventoryItem.className = 'inventory-item';
                    inventoryItem.dataset.id = item.inventoryId;
                    
                    inventoryItem.innerHTML = `
                        <input type="checkbox" class="select-checkbox" onchange="toggleSelectItem(${item.inventoryId})">
                        <img src="${item.image}" alt="${item.name}">
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">${item.price.toLocaleString()} зв</div>
                        <div class="inventory-item-actions">
                            <button class="inventory-sell-button" onclick="sellFromInventory(${item.inventoryId})">Продать</button>
                        </div>
                    `;
                    
                    inventoryGrid.appendChild(inventoryItem);
                });
            }
            
            // Функция выбора предмета для апгрейда
            window.toggleSelectItem = function(inventoryId) {
                const itemIndex = selectedItems.findIndex(item => item.inventoryId === inventoryId);
                
                if (itemIndex === -1) {
                    // Добавляем предмет в выбранные
                    const item = inventory.find(item => item.inventoryId === inventoryId);
                    if (item && selectedItems.length < 2) {
                        selectedItems.push(item);
                    }
                } else {
                    // Удаляем предмет из выбранных
                    selectedItems.splice(itemIndex, 1);
                }
                
                // Обновляем отображение выбранных предметов
                updateUpgradeSelection();
                
                // Активируем кнопку апгрейда, если выбрано 2 предмета
                upgradeButton.disabled = selectedItems.length !== 2;
            }
            
            // Обновление отображения выбранных предметов для апгрейда
            function updateUpgradeSelection() {
                if (selectedItems.length >= 1) {
                    upgradeItem1.innerHTML = `
                        <img src="${selectedItems[0].image}" alt="${selectedItems[0].name}">
                        <div class="item-name">${selectedItems[0].name}</div>
                    `;
                } else {
                    upgradeItem1.innerHTML = `
                        <img src="" alt="Предмет 1">
                        <div class="item-name">Выберите предмет</div>
                    `;
                }
                
                if (selectedItems.length >= 2) {
                    upgradeItem2.innerHTML = `
                        <img src="${selectedItems[1].image}" alt="${selectedItems[1].name}">
                        <div class="item-name">${selectedItems[1].name}</div>
                    `;
                } else {
                    upgradeItem2.innerHTML = `
                        <img src="" alt="Предмет 2">
                        <div class="item-name">Выберите предмет</div>
                    `;
                }
            }
            
            // Продажа предмета из инвентаря
            window.sellFromInventory = function(inventoryId) {
                const itemIndex = inventory.findIndex(item => item.inventoryId === inventoryId);
                if (itemIndex !== -1) {
                    const item = inventory[itemIndex];
                    balance += item.price;
                    balanceElement.textContent = balance;
                    
                    // Удаляем из выбранных, если предмет был выбран
                    const selectedIndex = selectedItems.findIndex(selected => selected.inventoryId === inventoryId);
                    if (selectedIndex !== -1) {
                        selectedItems.splice(selectedIndex, 1);
                        updateUpgradeSelection();
                        upgradeButton.disabled = selectedItems.length !== 2;
                    }
                    
                    // Удаляем из инвентаря
                    inventory.splice(itemIndex, 1);
                    updateInventoryDisplay();
                    
                    // Показываем уведомление
                    showNotification(`Предмет "${item.name}" продан за ${item.price.toLocaleString()} зв`);
                }
            };
            
            // Апгрейд предметов
            upgradeButton.addEventListener('click', function() {
                if (selectedItems.length !== 2) return;
                
                upgradeButton.disabled = true;
                
                // Удаляем выбранные предметы из инвентаря
                selectedItems.forEach(item => {
                    const itemIndex = inventory.findIndex(invItem => invItem.inventoryId === item.inventoryId);
                    if (itemIndex !== -1) {
                        inventory.splice(itemIndex, 1);
                    }
                });
                
                // Анимация вращения колеса
                const spinDuration = 3000; // 3 секунды
                const startTime = Date.now();
                
                const spinWheel = () => {
                    const currentTime = Date.now();
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / spinDuration, 1);
                    
                    // Замедление в конце
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    const rotation = easeOut * 1800; // 5 полных оборотов
                    
                    wheelCircle.style.transform = `rotate(${rotation}deg)`;
                    
                    if (progress < 1) {
                        requestAnimationFrame(spinWheel);
                    } else {
                        // Определяем результат
                        const finalAngle = rotation % 360;
                        const success = finalAngle >= 0 && finalAngle <= 108; // 30% шанс успеха
                        
                        // Показываем результат
                        if (success) {
                            // Создаем новый предмет с увеличенной ценой
                            const newItem = {
                                ...selectedItems[0],
                                inventoryId: Date.now() + Math.random(),
                                price: Math.max(selectedItems[0].price, selectedItems[1].price) * 2,
                                name: "Улучшенный " + selectedItems[0].name
                            };
                            
                            // Добавляем новый предмет в инвентарь
                            addToInventory(newItem);
                            
                            upgradeResult.innerHTML = `
                                <div class="upgrade-success">Апгрейд успешен! Вы получили улучшенный предмет!</div>
                                <img src="${newItem.image}" alt="${newItem.name}" style="width: 100px; height: 100px; margin-top: 10px; border-radius: 10px;">
                                <div>${newItem.name}</div>
                                <div>Цена: ${newItem.price.toLocaleString()} зв</div>
                            `;
                            
                            showNotification("Апгрейд успешен! Получен улучшенный предмет");
                        } else {
                            upgradeResult.innerHTML = `
                                <div class="upgrade-fail">Апгрейд не удался! Оба предмета сгорели.</div>
                            `;
                            showNotification("Апгрейд не удался! Предметы сгорели");
                        }
                        
                        upgradeResult.style.display = 'block';
                        
                        // Сбрасываем выбор
                        selectedItems = [];
                        updateUpgradeSelection();
                        
                        // Сбрасываем колесо через 3 секунды
                        setTimeout(() => {
                            wheelCircle.style.transform = 'rotate(0deg)';
                            upgradeResult.style.display = 'none';
                            upgradeButton.disabled = selectedItems.length !== 2;
                        }, 3000);
                    }
                };
                
                spinWheel();
            });
            
            // Функция показа уведомления
            function showNotification(message) {
                // Создаем элемент уведомления
                const notification = document.createElement('div');
                notification.textContent = message;
                notification.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: rgba(0, 0, 0, 0.8);
                    color: white;
                    padding: 15px 20px;
                    border-radius: 10px;
                    border-left: 4px solid #ff9a00;
                    z-index: 1000;
                    font-size: 1rem;
                    max-width: 300px;
                    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
                    animation: slideIn 0.3s ease-out;
                `;
                
                document.body.appendChild(notification);
                
                // Удаляем уведомление через 3 секунды
                setTimeout(() => {
                    notification.style.animation = 'slideOut 0.3s ease-in';
                    setTimeout(() => {
                        if (notification.parentNode) {
                            document.body.removeChild(notification);
                        }
                    }, 300);
                }, 3000);
            }
            
            // Добавляем стили для анимации уведомлений
            const style = document.createElement('style');
            style.textContent = `
                @keyframes slideIn {
                    from { transform: translateX(100%); opacity: 0; }
                    to { transform: translateX(0); opacity: 1; }
                }
                @keyframes slideOut {
                    from { transform: translateX(0); opacity: 1; }
                    to { transform: translateX(100%); opacity: 0; }
                }
            `;
            document.head.appendChild(style);
            
            // Инициализация инвентаря при загрузке
            updateInventoryDisplay();
        });
    </script>
</body>
</html>
