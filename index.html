<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plotnikov Peppers - Кейсы + Слоты</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            background: linear-gradient(45deg, #ff9a00, #ff6a00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .balance-container {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }
        
        /* === СЛОТ-МАШИНА === */
        .slot-machine {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 20px;
            border: 3px solid #ff9a00;
            box-shadow: 0 0 20px rgba(255, 154, 0, 0.5);
            z-index: 1000;
            text-align: center;
            width: 280px;
        }
        
        .slot-reels {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            height: 120px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px;
        }
        
        .reel {
            width: 80px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 10px;
            position: relative;
        }
        
        .reel-strip {
            display: flex;
            flex-direction: column;
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.3, 1);
        }
        
        .reel-item {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            margin: 5px 0;
        }
        
        .slot-spin-button {
            background: linear-gradient(45deg, #ff9a00, #ff6a00);
            border: none;
            color: white;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 106, 0, 0.4);
            transition: all 0.3s;
        }
        
        .slot-spin-button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 106, 0, 0.6);
        }
        
        .slot-spin-button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }
        
        .slot-result {
            margin-top: 10px;
            font-size: 1rem;
            font-weight: bold;
            min-height: 24px;
        }
        
        .win-glow {
            animation: winPulse 1s infinite;
        }
        
        @keyframes winPulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 200, 83, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(0, 200, 83, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 200, 83, 0); }
        }
        
        /* Остальные стили (кейсы, апгрейд, инвентарь) — как раньше */
        .case-container, .spin-area, .result-container, .possible-items, 
        .upgrade-section, .inventory-section, .section-divider {
            width: 100%;
            max-width: 800px;
            margin: 20px 0;
        }
        
        .case-image {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        
        .spin-button {
            background: linear-gradient(45deg, #ff9a00, #ff6a00);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        .items-grid, .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }
    </style>
</head>

8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f" },
            ];

            // === ИНИЦИАЛИЗАЦИЯ ===
            caseItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.style.cssText = 'background:rgba(255,255,255,0.1);border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center;';
                card.innerHTML = `<img src="${item.image}" style="width:100px;height:100px;object-fit:cover;border-radius:8px;">
                                  <div style="margin-top:8px;font-size:0.9rem;">${item.name}</div>
                                  <div style="margin-top:5px;font-size:0.8rem;color:#ff9a00;">${item.price.toLocaleString()} зв</div>`;
                document.getElementById('itemsGrid').appendChild(card);
            });

            // === КЕЙСЫ ===
            let isSpinning = false;
            let currentWinItem = null;

            document.getElementById('caseImage').onclick = () => {
                if (balance >= 1 && !isSpinning) {
                    document.getElementById('spinButton').disabled = false;
                }
            };

            document.getElementById('spinButton').onclick = () => {
                if (balance < 1 || isSpinning) return;
                isSpinning = true;
                document.getElementById('spinButton').disabled = true;
                balance -= 1;
                balanceEl.textContent = balance;

                const spinArea = document.getElementById('spinArea');
                const spinItems = document.getElementById('spinItems');
                spinArea.style.display = 'block';
                spinItems.innerHTML = '';

                const winIdx = Math.floor(Math.random() * caseItems.length);
                currentWinItem = { ...caseItems[winIdx] };
                const total = 35;
                const itemW = 200;

                for (let i = 0; i < total; i++) {
                    const item = i === total - 3 ? currentWinItem : caseItems[Math.floor(Math.random() * caseItems.length)];
                    const el = document.createElement('div');
                    el.style.cssText = 'width:200px;display:flex;flex-direction:column;align-items:center;padding:10px;';
                    el.innerHTML = `<img src="${item.image}" style="width:120px;height:120px;object-fit:cover;border-radius:10px;">
                                    <div style="margin-top:10px;font-size:0.9rem;">${item.name}</div>`;
                    spinItems.appendChild(el);
                }

                const center = spinArea.offsetWidth / 2 - itemW / 2;
                const target = -((total - 3) * itemW) + center;
                let pos = 0, speed = 60;

                const animate = () => {
                    pos -= speed;
                    if (Math.abs(pos - target) < 1000) speed *= 0.93;
                    if (pos <= target) {
                        pos = target;
                        spinItems.style.transform = `translateX(${pos}px)`;
                        setTimeout(() => showCaseResult(), 600);
                        return;
                    }
                    spinItems.style.transform = `translateX(${pos}px)`;
                    requestAnimationFrame(animate);
                };
                requestAnimationFrame(animate);
            };

            function showCaseResult() {
                document.getElementById('resultImage').src = currentWinItem.image;
                document.getElementById('resultItemName').textContent = currentWinItem.name;
                document.getElementById('prizeValue').textContent = currentWinItem.price.toLocaleString();
                document.getElementById('resultContainer').style.display = 'flex';
                isSpinning = false;
            }

            document.getElementById('sellButton').onclick = () => {
                balance += currentWinItem.price;
                balanceEl.textContent = balance;
                hideResult();
            };

            document.getElementById('keepButton').onclick = () => {
                addToInventory(currentWinItem);
                hideResult();
            };

            function hideResult() {
                document.getElementById('resultContainer').style.display = 'none';
                document.getElementById('spinArea').style.display = 'none';
            }

            // === ИНВЕНТАРЬ ===
            let inventory = [];
            function addToInventory(item) {
                inventory.push({ ...item, id: Date.now() });
                updateInventory();
            }

            function updateInventory() {
                const grid = document.getElementById('inventoryGrid');
                grid.innerHTML = inventory.length === 0 
                    ? '<div style="grid-column:1/-1;text-align:center;color:#999;padding:20px;">Инвентарь пуст</div>'
                    : '';
                inventory.forEach(item => {
                    const el = document.createElement('div');
                    el.style.cssText = 'background:rgba(255,255,255,0.1);border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center;position:relative;';
                    el.innerHTML = `<img src="${item.image}" style="width:80px;height:80px;object-fit:cover;border-radius:8px;">
                                    <div style="margin-top:8px;font-size:0.8rem;">${item.name}</div>
                                    <div style="margin-top:5px;font-size:0.7rem;color:#ff9a00;">${item.price.toLocaleString()} зв</div>
                                    <button style="margin-top:8px;background:#00c853;color:white;padding:5px 10px;border:none;border-radius:15px;font-size:0.7rem;cursor:pointer;" onclick="sellInventory(${item.id})">Продать</button>`;
                    grid.appendChild(el);
                });
            }

            window.sellInventory = (id) => {
                const idx = inventory.findIndex(i => i.id === id);
                if (idx !== -1) {
                    balance += inventory[idx].price;
                    balanceEl.textContent = balance;
                    inventory.splice(idx, 1);
                    updateInventory();
                }
            };

            // === СЛОТ-МАШИНА ===
            let isSlotSpinning = false;
            const reels = [document.getElementById('reel1').querySelector('.reel-strip'), 
                           document.getElementById('reel2').querySelector('.reel-strip'), 
                           document.getElementById('reel3').querySelector('.reel-strip')];
            
            // Заполняем барабаны
            slotSymbols.forEach(sym => {
                [0,1,2].forEach(i => {
                    const img = document.createElement('img');
                    img.src = sym.image;
                    img.className = 'reel-item';
                    reels[i].appendChild(img.cloneNode());
                });
            });

            document.getElementById('slotSpinButton').onclick = () => {
                if (balance < 1000 || isSlotSpinning) return;
                isSlotSpinning = true;
                document.getElementById('slotSpinButton').disabled = true;
                balance -= 1000;
                balanceEl.textContent = balance;
                document.getElementById('slotResult').textContent = '';

                const spins = [3 + Math.random() * 5, 4 + Math.random() * 5, 5 + Math.random() * 5];
                const results = slotSymbols.map(() => Math.floor(Math.random() * slotSymbols.length));
                let done = 0;

                reels.forEach((reel, i) => {
                    let pos = 0;
                    const target = spins[i] * 90 + results[i] * 90;
                    const animate = () => {
                        pos += 30;
                        if (pos >= target) {
                            pos = target;
                            reel.style.transform = `translateY(-${pos}px)`;
                            if (++done === 3) checkSlotWin(results);
                            return;
                        }
                        reel.style.transform = `translateY(-${pos}px)`;
                        setTimeout(animate, 50);
                    };
                    setTimeout(animate, i * 300);
                });
            };

            function checkSlotWin(results) {
                isSlotSpinning = false;
                document.getElementById('slotSpinButton').disabled = balance < 1000;
                if (results[0] === results[1] && results[1] === results[2]) {
                    const win = 10000;
                    balance += win;
                    balanceEl.textContent = balance;
                    document.getElementById('slotResult').innerHTML = `<span style="color:#00c853;font-weight:bold;">ВЫИГРЫШ! +${win} зв</span>`;
                    document.querySelectorAll('.reel').forEach(r => r.classList.add('win-glow'));
                    setTimeout(() => document.querySelectorAll('.reel').forEach(r => r.classList.remove('win-glow')), 2000);
                } else {
                    document.getElementById('slotResult').textContent = 'Попробуйте снова';
                }
            }

            // Инициализация
            updateInventory();
            document.getElementById('slotSpinButton').disabled = balance < 1000;
        });
    </script>
</body>
</html>
